<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error | Fitness Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-6 text-center">
      <div class="display-1 text-danger fw-bold mb-3">!</div>
      <h1 class="h2 mb-4">Something went wrong</h1>
      <div class="alert alert-danger shadow-sm py-3 mb-4">
        <p class="mb-0" th:text="${errorMessage}">Error details go here.</p>
      </div>
      <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2">Back to Dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
