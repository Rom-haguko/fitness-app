<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workout Plan Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Fitness App</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/plans">My Plans</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h2 class="card-title" th:text="${'Plan: ' + plan.goal}">Goal</h2>
            <p class="text-muted">
                Created on: <span th:text="${#temporals.format(plan.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span> |
                Level: <span th:text="${plan.level}">Level</span>
            </p>
            <div class="btn-group">
                <a th:href="@{'/export/plan/' + ${plan.id} + '?format=pdf'}" class="btn btn-outline-danger btn-sm">Download PDF</a>
                <a th:href="@{'/export/plan/' + ${plan.id} + '?format=txt'}" class="btn btn-outline-dark btn-sm">Download TXT</a>
            </div>
        </div>
    </div>

    <!-- Loop through days -->
    <div th:each="dayNum : ${#numbers.sequence(1, plan.daysPerWeek)}">
        <h4 class="mt-4 mb-3" th:text="${'Day ' + dayNum}">Day 1</h4>
        <div class="row">
            <div th:each="item : ${plan.items}" th:if="${item.dayNumber == dayNum}" class="col-md-6 col-lg-4 mb-3">
                <div class="card h-100 border-primary">
                    <div class="card-body">
                        <h5 class="card-title text-primary" th:text="${item.exerciseName}">Bench Press</h5>
                        <p class="card-text">
                            <strong>Sets:</strong> <span th:text="${item.setsCount}">3</span><br>
                            <strong>Reps:</strong> <span th:text="${item.repsText}">10-12</span>
                        </p>
                        <small class="text-muted" th:text="${item.focus}">Chest</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5 mb-5 text-center">
        <a href="/plans" class="btn btn-primary">Back to History</a>
    </div>
</div>
</body>
</html>
