<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Workout Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Fitness App</a>
        <div class="navbar-nav">
            <a class="nav-link btn btn-primary text-white ms-2" href="/questionnaire">New Plan</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">My Training History</h2>

    <div th:if="${#lists.isEmpty(plans)}" class="alert alert-info">
        You haven't generated any plans yet. <a href="/questionnaire">Create your first plan!</a>
    </div>

    <div class="row" th:unless="${#lists.isEmpty(plans)}">
        <div th:each="plan : ${plans}" class="col-md-6 col-lg-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-capitalize" th:text="${plan.goal}">Goal</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${plan.level}">Level</h6>
                    <p class="card-text">
                        <strong>Frequency:</strong> <span th:text="${plan.daysPerWeek}">3</span> days/week<br>
                        <strong>Created:</strong> <span th:text="${#temporals.format(plan.createdAt, 'yyyy-MM-dd')}">Date</span>
                    </p>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{'/plans/' + ${plan.id}}" class="btn btn-primary btn-sm">View Details</a>
                        <a th:href="@{/plans/{id}(id=${plan.id})}" class="btn btn-outline-success btn-sm">Log Workout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
