<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress | Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">FitnessApp</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/plans">My Plans</a>
            <a class="nav-link active" href="/progress">Statistics</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Training Statistics</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#weightModal">Update Weight</button>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm" role="alert">
        <span th:if="${param.success[0] == 'true'}">Workout progress saved!</span>
        <span th:if="${param.success[0] == 'weight_saved'}">Body weight updated!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 bg-primary text-white">
                <div class="card-body p-4 text-center">
                    <h6 class="text-uppercase small mb-2 opacity-75">Total Workouts</h6>
                    <h2 class="display-4 fw-bold" th:text="${summary.totalWorkouts}">0</h2>
                    <p class="mb-0">sessions</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 bg-white">
                <div class="card-body p-4 text-center">
                    <h6 class="text-uppercase small mb-2 text-muted">Current Weight</h6>
                    <h2 class="display-4 fw-bold text-success"
                        th:text="${summary.currentWeight != null ? summary.currentWeight + ' kg' : 'N/A'}">--</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 bg-white">
                <div class="card-body p-4 text-center">
                    <h6 class="text-uppercase small mb-2 text-muted">Total Volume</h6>
                    <h2 class="display-5 fw-bold text-dark"
                        th:text="${summary.totalVolume != null ? summary.totalVolume + ' kg' : '0'}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-3">
                <h5 class="fw-bold mb-3">Body Weight Progress</h5>
                <canvas id="weightChartCanvas"></canvas>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-3">
                <h5 class="fw-bold mb-3">Training Volume (Total kg)</h5>
                <canvas id="volumeChartCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="weightModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Record Body Weight</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/progress/weight}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Current Weight (kg)</label>
                        <input type="number" step="0.1" name="weight" class="form-control form-control-lg" required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 py-2">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const weightRaw = /*[[${weightChart}]]*/ [];
    const volumeRaw = /*[[${volumeChart}]]*/ [];
    /*]]>*/

    function renderChart(canvasId, label, points, color, valueKey) {
        const ctx = document.getElementById(canvasId).getContext('2d');

        if (!points || !points.points || points.points.length === 0) {
            return new Chart(ctx, { type: 'line', data: { labels: ['No Data'], datasets: [] } });
        }

        const labels = points.points.map(p => p.date);
        const values = points.points.map(p => p[valueKey]);

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: values,
                    borderColor: color,
                    backgroundColor: color + '22',
                    fill: true,
                    tension: 0.3,
                    borderWidth: 3,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: false },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderChart('weightChartCanvas', 'Weight (kg)', weightRaw, '#198754', 'weight');
        renderChart('volumeChartCanvas', 'Volume (kg)', volumeRaw, '#0d6efd', 'volume');
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
