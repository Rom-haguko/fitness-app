<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    <h2 class="text-center mb-4">Create Account</h2>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                        <div th:if="${passwordError}" class="alert alert-danger py-2 small" th:text="${passwordError}"></div>

                        <div class="mb-3">
                            <label class="form-label small">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small">Password</label>
                                <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small">Confirm Password</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mt-2 mb-3">Register</button>
                    </form>

                    <div class="text-center">
                        <span class="small text-muted">Already have an account?</span>
                        <a th:href="@{/login}" class="small text-decoration-none">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
