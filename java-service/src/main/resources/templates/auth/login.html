<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    <h2 class="text-center mb-4">Welcome Back</h2>


                    <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                        Invalid username or password.
                    </div>

                    <div th:if="${param.registered}" class="alert alert-success py-2 small" role="alert">
                        Registration successful! Please login.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" name="username" class="form-control" id="uName" placeholder="Username" required>
                            <label for="uName">Username</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" name="password" class="form-control" id="uPass" placeholder="Password" required>
                            <label for="uPass">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign In</button>
                    </form>

                    <div class="text-center">
                        <span class="small text-muted">Don't have an account?</span>
                        <a th:href="@{/register}" class="small text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
