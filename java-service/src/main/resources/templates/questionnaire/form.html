<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Workout Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Fitness App</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Workout Questionnaire</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/questionnaire}" th:object="${questionnaireForm}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Fitness Goal</label>
                            <select class="form-select" th:field="*{goal}" required>
                                <option value="muscle_gain">Muscle Gain</option>
                                <option value="fat_loss">Fat Loss</option>
                                <option value="strength">Strength</option>
                                <option value="endurance">Endurance</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Your Level</label>
                            <select class="form-select" th:field="*{level}" required>
                                <option value="beginner">Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Training Days Per Week</label>
                                <input type="number" class="form-control" th:field="*{daysPerWeek}" min="1" max="7" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Split Type (Optional)</label>
                                <select class="form-select" th:field="*{splitType}">
                                    <option value="full_body">Full Body</option>
                                    <option value="upper_lower">Upper / Lower</option>
                                    <option value="push_pull_legs">Push / Pull / Legs</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Weight (kg)</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{weight}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Height (cm)</label>
                                <input type="number" class="form-control" th:field="*{height}">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Generate My Plan</button>
                            <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
